name: Build APK

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Bump version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == v* ]]; then
            CLEAN="${TAG#v}"
            # "1.2.3" -> 10203, "1.0" -> 100, dst
            IFS='.' read -ra PARTS <<< "$CLEAN"
            MAJOR="${PARTS[0]:-1}"
            MINOR="${PARTS[1]:-0}"
            PATCH="${PARTS[2]:-0}"
            CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
            NAME="$CLEAN"
          else
            CODE="100"
            NAME="1.0.0"
          fi
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Tag: $TAG -> code=$CODE name=$NAME"

      - name: Write version into gradle
        run: |
          CODE="${{ steps.version.outputs.version_code }}"
          NAME="${{ steps.version.outputs.version_name }}"
          sed -i "s/versionCode = 100/versionCode = $CODE/" app/build.gradle.kts
          sed -i "s/versionName = \"1.0.0\"/versionName = \"$NAME\"/" app/build.gradle.kts

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tsukinime-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "TsukiNime v${{ steps.version.outputs.version_name }}"
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
